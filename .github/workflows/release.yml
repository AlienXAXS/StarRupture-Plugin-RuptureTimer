name: Build and Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package only: no GitHub release, no Nexus upload'
        type: boolean
        default: false

jobs:
  release:
    permissions:
      contents: write
    uses: AlienXAXS/StarRupture-Plugin-SDK/.github/workflows/plugin-release.yml@v1.23.0
    with:
      plugin_name: RuptureTimer
      solution_file: RuptureTimer.sln
      release_title: RuptureTimer Plugin
      server_build: true
      # Global (v3 API) id of the mod page: GET /v3/games/starrupture/mods/144 -> data.id
      nexus_mod_id: '37074157699216'
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
